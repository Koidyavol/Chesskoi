<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Life of Adventurer</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#171923;color:#e8e6df;font-family:system-ui,Arial}header{padding:18px;background:#242938;border-bottom:1px solid #454b5c}h1{margin:0;font-size:22px;color:#e9c779}small{color:#aeb6c7}.wrap{max-width:900px;margin:auto;padding:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat,.panel{background:#252b3a;border:1px solid #41495b;border-radius:12px;padding:12px}.stat b{display:block;color:#e9c779}.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.tabs button,button{background:#414b60;color:#fff;border:0;border-radius:9px;padding:10px;cursor:pointer}.tabs button.active{background:#b18a48;color:#171923;font-weight:bold}button:disabled{opacity:.4}.panel h2{margin:0 0 10px;color:#e9c779;font-size:18px}.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.actions button{background:#364359;text-align:left}.log{height:220px;overflow:auto;background:#11151d;border-radius:10px;padding:10px;line-height:1.5}.log p{margin:5px 0;border-bottom:1px solid #252b3a;padding-bottom:5px}.row{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:8px 0}.badge{font-size:12px;color:#9bb7d9}.meter{height:8px;background:#111;border-radius:5px;overflow:hidden}.meter i{display:block;height:100%;background:#69b887}.item{padding:8px;background:#313a4b;border-radius:8px;margin:5px 0}input,select{background:#161b24;color:white;padding:10px;border:1px solid #566076;border-radius:8px;width:100%} @media(max-width:500px){.stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header><h1>⚔ Life of Adventurer</h1><small>Jalani hidupmu di dunia fantasi</small></header><div class="wrap" id="app"></div>
<script>
const $=id=>document.getElementById(id);let s=JSON.parse(localStorage.getItem('loa_save')||'null');let tab='Kota',fight=null;
const areas=['Kota','Status','Kerja','Guild','Hunting','Inventory','Skill','Journal'];
const monsters=[{n:'Slime',hp:18,xp:8,g:7},{n:'Goblin',hp:30,xp:15,g:12},{n:'Wolf',hp:35,xp:18,g:15},{n:'Forest Boar',hp:44,xp:22,g:19}];
function fresh(name,cls){return {name,cls,lv:1,xp:0,hp:100,mp:40,energy:100,hunger:0,mood:80,gold:80,day:1,hour:8,loc:'Kota Eldoria',job:'Belum bekerja',stats:{atk:8,def:5,mag:5},inv:['Roti x2','Potion x1'],kills:0,quests:0,log:['Kamu tiba di Eldoria. Dunia baru terbuka di hadapanmu.']}}
function save(){localStorage.setItem('loa_save',JSON.stringify(s))}
function say(t){s.log.unshift(t);s.log=s.log.slice(0,40);save();render()}
function time(){return 'Hari '+s.day+' · '+String(s.hour).padStart(2,'0')+':00'}
function advance(h=1){for(let i=0;i<h;i++){s.hour++;if(s.hour>=24){s.hour=0;s.day++;s.hunger=Math.min(100,s.hunger+18);s.energy=Math.min(100,s.energy+12);s.mood=Math.max(0,s.mood-3);s.hp=Math.min(100,s.hp+8);s.log.unshift('Hari baru dimulai.')} }save()}
function xp(n){s.xp+=n;while(s.xp>=s.lv*30){s.xp-=s.lv*30;s.lv++;s.stats.atk++;s.stats.def++;s.hp=100;s.mp=40;s.log.unshift('Level naik! Sekarang Lv '+s.lv+'.')}save()}
function create(){let n=$('name').value.trim()||'Adventurer';s=fresh(n,$('class').value);if(s.cls==='Mage'){s.stats.mag=9;s.mp=60}else if(s.cls==='Warrior'){s.stats.atk=10;s.stats.def=8}else if(s.cls==='Archer'){s.stats.atk=9}else if(s.cls==='Thief'){s.stats.atk=9;s.stats.def=6}save();render()}
function render(){if(!s){$('app').innerHTML='<div class="panel"><h2>Mulai petualangan</h2><p>Namamu akan dikenal di dunia Eldoria.</p><input id="name" placeholder="Nama karakter"><p><select id="class"><option>Warrior</option><option>Archer</option><option>Thief</option><option>Mage</option><option>Cleric</option></select></p><button onclick="create()">Mulai</button></div>';return}
let xpNeed=s.lv*30;$('app').innerHTML='<div class="stats">'+[['❤ HP',s.hp+'/100'],['✦ MP',s.mp+'/ '+(s.cls==='Mage'?60:40)],['⚡ Energi',s.energy],['💰 Gold',s.gold]].map(a=>'<div class="stat">'+a[0]+'<b>'+a[1]+'</b></div>').join('')+'</div><div class="row"><span>'+s.name+' · '+s.cls+' · Lv '+s.lv+'</span><span class="badge">'+time()+'</span></div><div class="meter"><i style="width:'+Math.round(s.xp/xpNeed*100)+'%"></i></div><small>EXP '+s.xp+'/'+xpNeed+' · '+s.loc+'</small><div class="tabs">'+areas.map(a=>'<button class="'+(tab===a?'active':'')+'" onclick="tab=\''+a+'\';render()">'+a+'</button>').join('')+'</div><div id="panel" class="panel">'+panel()+'</div><h2>📜 Log</h2><div class="log">'+s.log.map(x=>'<p>'+x+'</p>').join('')+'</div><div class="row"><button onclick="exportSave()">Export save</button><button onclick="importSave()">Import save</button><button onclick="resetGame()">Reset</button></div>'}
function panel(){switch(tab){
case'Kota':return '<h2>Kota Eldoria</h2><p>Jalan-jalan di kota, mencari pekerjaan atau beristirahat.</p><div class="actions"><button onclick="rest()">🏠 Istirahat (+energi)</button><button onclick="eat()">🍞 Makan roti</button><button onclick="visitMarket()">🛒 Pasar</button><button onclick="advance(2);say(\'Kamu berjalan santai mengelilingi kota.\')">🚶 Jalan-jalan (2 jam)</button><button onclick="say(\'Rumor: hutan di luar kota dipenuhi monster dan material langka.\')">👂 Dengarkan rumor</button></div>';
case'Status':return '<h2>Status karakter</h2><p>Level '+s.lv+' · '+s.cls+'</p><p>ATK '+s.stats.atk+' | DEF '+s.stats.def+' | MAG '+s.stats.mag+'</p><p>Energi '+s.energy+' · Hunger '+s.hunger+' · Mood '+s.mood+'</p><p>Monster dikalahkan: '+s.kills+'</p>';
case'Kerja':return '<h2>Pekerjaan</h2><p>Pekerjaan saat ini: '+s.job+'</p><div class="actions">'+['Pelayan Tavern','Penjaga Kota','Petani','Pengrajin'].map(j=>'<button onclick="job(\''+j+'\')">'+j+'</button>').join('')+'<button onclick="work()">🧰 Kerja (4 jam)</button></div><small>Kerja menghabiskan energi dan menghasilkan gold.</small>';
case'Guild':return '<h2>Adventurer Guild</h2><p>Rank: '+(s.kills<5?'F':s.kills<15?'E':'D')+' · Quest selesai '+s.quests+'</p><div class="actions"><button onclick="quest()">📋 Ambil quest berburu</button><button onclick="say(\'Papan quest: kumpulkan material atau kalahkan monster di hutan.\')">Papan quest</button></div>';
case'Hunting':return '<h2>Hutan dekat Eldoria</h2><p>Berburu menghabiskan 3 jam dan energi.</p><div class="actions">'+monsters.map(m=>'<button onclick="hunt(\''+m.n+'\')">⚔ '+m.n+' · HP '+m.hp+'</button>').join('')+'</div>'+ (fight?combatPanel():'');
case'Inventory':return '<h2>Inventory</h2>'+s.inv.map(x=>'<div class="item">'+x+'</div>').join('')+'<p>Barang yang kamu bawa.</p>';
case'Skill':return '<h2>Skill</h2><p>Basic Attack · serangan dasar</p><p>Skill berkembang ketika level naik.</p><button onclick="train()">📚 Latihan (2 jam, 15 gold)</button>';
case'Journal':return '<h2>Journal</h2><p>Hari '+s.day+' · '+s.loc+'</p><p>Perjalananmu: '+s.kills+' monster kalah, '+s.quests+' quest selesai.</p>';
}}
function rest(){s.energy=Math.min(100,s.energy+45);s.hp=Math.min(100,s.hp+25);s.mp=Math.min(s.cls==='Mage'?60:40,s.mp+20);advance(6);say('Kamu beristirahat, tubuh terasa lebih segar.')}
function eat(){let i=s.inv.findIndex(x=>x.startsWith('Roti'));if(i<0){say('Kamu tidak memiliki roti.');return}let count=parseInt(s.inv[i].split('x')[1]||1);if(count<=1)s.inv.splice(i,1);else s.inv[i]='Roti x'+(count-1);s.hunger=Math.max(0,s.hunger-30);s.mood=Math.min(100,s.mood+5);say('Kamu makan roti.')}
function visitMarket(){if(s.gold<10){say('Gold tidak cukup membeli makanan.');return} s.gold-=10;s.inv.push('Roti x1');say('Kamu membeli roti seharga 10 gold.')}
function job(j){s.job=j;say('Kamu diterima sebagai '+j+'.')}
function work(){if(s.job==='Belum bekerja'){say('Cari pekerjaan dulu.');return}if(s.energy<20){say('Energi terlalu rendah untuk bekerja.');return}s.energy-=20;let wage= s.job==='Penjaga Kota'?45:s.job==='Pengrajin'?38:s.job==='Petani'?30:25;s.gold+=wage;advance(4);say('Kamu bekerja sebagai '+s.job+' dan menerima '+wage+' gold.')}
function train(){if(s.gold<15||s.energy<15){say('Gold atau energi tidak cukup.');return}s.gold-=15;s.energy-=15;s.stats.atk++;advance(2);say('Latihan selesai. ATK meningkat.')}
function hunt(n){if(s.energy<25){say('Energi terlalu rendah untuk berburu.');return}let m=monsters.find(x=>x.n===n);s.energy-=25;advance(3);fight={m:{...m},hp:m.hp};tab='Hunting';say('Kamu menemukan '+n+'!');render()}
function combatPanel(){return '<hr><h3>Battle: '+fight.m.n+' ('+fight.hp+' HP)</h3><div class="actions"><button onclick="attack()">⚔ Serang</button><button onclick="run()">🏃 Kabur</button></div>'}
function attack(){if(!fight)return;let dmg=Math.max(1,s.stats.atk+Math.floor(Math.random()*5));fight.hp-=dmg;if(fight.hp<=0){let m=fight.m;s.gold+=m.g;s.kills++;xp(m.xp);fight=null;say('Monster dikalahkan! Loot '+m.g+' gold dan EXP.');return}let hit=Math.max(1,5+Math.floor(Math.random()*7)-s.stats.def);s.hp-=hit;if(s.hp<=0){s.hp=25;s.gold=Math.floor(s.gold*.7);fight=null;s.loc='Kota Eldoria';say('Kamu tumbang dan dibawa kembali ke kota. Sebagian gold hilang.');return}say('Seranganmu menghasilkan '+dmg+' damage. Monster membalas '+hit+' damage.');render()}
function run(){fight=null;say('Kamu mundur dari pertarungan.')}
function quest(){if(s.energy<25){say('Energi tidak cukup.');return}s.energy-=25;advance(3);let m=monsters[Math.floor(Math.random()*monsters.length)];fight={m:{...m,hp:Math.floor(m.hp*.8),g:m.g+20,xp:m.xp+8},hp:Math.floor(m.hp*.8)};tab='Hunting';say('Quest: kalahkan '+m.n+'!');render()}
function exportSave(){let b=new Blob([JSON.stringify(s)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='loa-save.json';a.click();URL.revokeObjectURL(u)}
function importSave(){let i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{let f=i.files[0],r=new FileReader();r.onload=()=>{try{s=JSON.parse(r.result);save();render()}catch(e){alert('File save tidak valid')}};r.readAsText(f)};i.click()}
function resetGame(){if(confirm('Reset semua progres?')){localStorage.removeItem('loa_save');s=null;render()}}
render();
</script></body></html>
