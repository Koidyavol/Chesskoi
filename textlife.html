<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Life of Adventurer</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111720;color:#e8e7df;font:15px system-ui}header{padding:16px;background:linear-gradient(120deg,#222d3c,#17202c);border-bottom:1px solid #46566a}h1{margin:0;color:#e9c779;font-size:22px}.wrap{max-width:900px;margin:auto;padding:12px}.muted,small{color:#aab7c9}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat,.panel{background:#202a38;border:1px solid #3d4c60;border-radius:12px;padding:12px}.stat b{display:block;color:#e9c779;margin-top:3px}.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.tabs button,button{background:#3b4a60;color:#fff;border:1px solid #52627a;border-radius:9px;padding:10px;cursor:pointer}.tabs button.active{background:#c49a53;color:#161b22;font-weight:700}.panel h2{margin:0 0 10px;color:#e9c779;font-size:18px}.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.actions button{text-align:left;background:#334256}.log{height:190px;overflow:auto;background:#10151c;border-radius:10px;padding:10px;line-height:1.45}.log p{margin:5px 0;padding-bottom:5px;border-bottom:1px solid #242d39}.row{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}.meter{height:8px;background:#10151c;border-radius:5px;overflow:hidden;margin:4px 0}.meter i{display:block;height:100%;background:#69b887}.item{padding:9px;background:#303c4d;border-radius:8px;margin:6px 0;display:flex;justify-content:space-between;gap:8px;align-items:center}.pill{display:inline-block;padding:3px 8px;background:#35465b;border-radius:99px;font-size:12px}.input,select{background:#151c26;color:white;padding:10px;border:1px solid #52627a;border-radius:8px;width:100%}button:disabled{opacity:.4}.notice{padding:9px;border-radius:8px;background:#2d394b;margin:8px 0}@media(max-width:500px){.stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header><h1>⚔ Life of Adventurer</h1><small>Simulasi kehidupan di dunia fantasi · Eldoria</small></header><div class="wrap" id="app"></div><script>
const $=id=>document.getElementById(id);let s=JSON.parse(localStorage.getItem('loa_save')||'null'),tab='Kota';
const mobs=[{n:'Slime',hp:22,xp:9,g:8,atk:4,drop:'Gel Slime'},{n:'Goblin',hp:35,xp:17,g:14,atk:7,drop:'Goblin Ear'},{n:'Wolf',hp:42,xp:20,g:17,atk:8,drop:'Wolf Pelt'},{n:'Boar',hp:50,xp:25,g:22,atk:9,drop:'Boar Meat'},{n:'Forest Spider',hp:58,xp:30,g:27,atk:10,drop:'Spider Silk'}];
const maxmp=()=>s.cls==='Mage'?70:s.cls==='Cleric'?60:40;
function fresh(n,c){let p={name:n,cls:c,lv:1,xp:0,hp:100,mp:40,energy:100,hunger:0,mood:80,gold:100,day:1,hour:8,loc:'Eldoria',job:'Belum bekerja',stats:{atk:8,def:5,mag:5},inv:{'Roti':2,'Potion':2},kills:0,quests:0,skillpts:0,skills:{Power:0,Guard:0,Heal:0},quest:null,fight:null,log:['Kamu tiba di Eldoria. Guild dan kota ini akan menjadi awal perjalananmu.']};if(c==='Mage'){p.stats.mag=10;p.mp=70}else if(c==='Warrior'){p.stats.atk=10;p.stats.def=8}else if(c==='Archer'){p.stats.atk=9;p.stats.mag=6}else if(c==='Thief'){p.stats.atk=9;p.stats.def=6}else if(c==='Cleric'){p.stats.mag=8;p.mp=60}return p}
function save(){localStorage.setItem('loa_save',JSON.stringify(s))}
function log(t){s.log.unshift(t);s.log=s.log.slice(0,45);save();render()}
function time(){return 'Hari '+s.day+' · '+String(s.hour).padStart(2,'0')+':00'}
function advance(h){for(let i=0;i<h;i++){s.hour++;if(s.hour>=24){s.hour=0;s.day++;s.hunger=Math.min(100,s.hunger+15);s.mood=Math.max(0,s.mood-2);s.energy=Math.min(100,s.energy+8);s.log.unshift('Hari '+s.day+' dimulai.');if(s.day%7===0)s.log.unshift('Festival mingguan berlangsung di kota!')}}save()}
function addxp(n){s.xp+=n;let leveled=false;while(s.xp>=s.lv*35){s.xp-=s.lv*35;s.lv++;s.skillpts++;s.stats.atk++;s.stats.def++;leveled=true}if(leveled){s.hp=100;s.mp=maxmp();s.log.unshift('LEVEL UP! Lv '+s.lv+'. Skill point +1.');}save()}
function create(){s=fresh($('name').value.trim()||'Adventurer',$('cls').value);save();render()}
function render(){if(!s){$('app').innerHTML='<div class="panel"><h2>Awal petualangan</h2><p>Masukkan nama dan pilih class.</p><input id="name" class="input" placeholder="Nama karakter"><div style="margin:8px 0"><select id="cls" class="input"><option>Warrior</option><option>Archer</option><option>Thief</option><option>Mage</option><option>Cleric</option></select></div><button onclick="create()">Mulai perjalanan</button></div>';return}
let need=s.lv*35,areas=['Kota','Status','Kerja','Guild','Hunting','Inventory','Skill','Journal'];$('app').innerHTML='<div class="stats">'+[['❤ HP',s.hp+'/100'],['✦ MP',s.mp+'/'+maxmp()],['⚡ Energi',s.energy+'/100'],['💰 Gold',s.gold]].map(a=>'<div class="stat">'+a[0]+'<b>'+a[1]+'</b></div>').join('')+'</div><div class="row"><b>'+s.name+' <span class="pill">'+s.cls+'</span> Lv '+s.lv+'</b><span class="muted">'+time()+'</span></div><div class="meter"><i style="width:'+Math.min(100,s.xp/need*100)+'%"></i></div><small>EXP '+s.xp+'/'+need+' · '+s.loc+' · '+s.job+'</small><div class="tabs">'+areas.map(a=>'<button class="'+(tab===a?'active':'')+'" onclick="tab=\''+a+'\';render()">'+a+'</button>').join('')+'</div><div class="panel">'+panel()+'</div><h3>📜 Log kejadian</h3><div class="log">'+s.log.map(x=>'<p>'+x+'</p>').join('')+'</div><div class="row"><button onclick="exportSave()">Export save</button><button onclick="importSave()">Import save</button><button onclick="reset()">Reset</button></div>'}
function panel(){switch(tab){
case'Kota':return '<h2>Eldoria</h2><p>Alun-alun kota, tempat warga berkumpul dan berbagai aktivitas berlangsung.</p><div class="notice">Rumor hari ini: '+(s.day%3===0?'Pedagang keliling tiba di kota.':'Hutan dekat kota dihuni monster yang bisa diburu.')+'</div><div class="actions"><button onclick="rest()">🏠 Istirahat (6 jam)</button><button onclick="eat()">🍞 Makan</button><button onclick="market()">🛒 Beli roti / potion</button><button onclick="advance(2);log(\'Kamu menghabiskan waktu berjalan di alun-alun.\')">🚶 Jalan santai (2 jam)</button><button onclick="talk()">💬 Berbicara dengan warga</button><button onclick="advance(1);log(\'Kamu mengamati kehidupan kota.\')">👀 Mengamati kota</button></div>';
case'Status':return '<h2>Status</h2><p>ATK '+s.stats.atk+' · DEF '+s.stats.def+' · MAG '+s.stats.mag+'</p><p>Hunger '+s.hunger+'/100 · Mood '+s.mood+'/100</p><p>Monster defeated: '+s.kills+' · Quest selesai: '+s.quests+'</p><p>Skill points: '+s.skillpts+'</p>';
case'Kerja':return '<h2>Kerja</h2><p>Pekerjaan: <b>'+s.job+'</b></p><div class="actions">'+['Pelayan Tavern','Penjaga Kota','Petani','Pengrajin'].map(j=>'<button onclick="setjob(\''+j+'\')">'+j+'</button>').join('')+'<button onclick="work()">🧰 Shift kerja (4 jam)</button></div><small>Kerja menghabiskan energi. Pilih pekerjaan terlebih dahulu.</small>';
case'Guild':return '<h2>Adventurer Guild</h2><p>Rank '+rank()+' · Quest selesai '+s.quests+'</p><p>Guild quest memberikan reward tambahan. Quest aktif: '+(s.quest?s.quest.name:'Tidak ada')+'</p><div class="actions"><button onclick="takequest()">📋 Ambil quest</button><button onclick="claim()">🏆 Klaim reward quest</button></div>';
case'Hunting':return '<h2>Hutan Eldoria</h2><p>Berburu membutuhkan 20 energi dan 2 jam.</p><div class="actions">'+mobs.map(m=>'<button onclick="hunt(\''+m.n+'\')">⚔ '+m.n+' · HP '+m.hp+'</button>').join('')+'</div>'+ (s.fight?combat():'');
case'Inventory':return '<h2>Inventory</h2>'+Object.entries(s.inv).map(([n,q])=>'<div class="item"><span>'+n+' <span class="pill">x'+q+'</span></span>'+(['Roti','Potion'].includes(n)?'<button onclick="useitem(\''+n+'\')">Gunakan</button>':'')+'</div>').join('')+'<p class="muted">Loot monster dan barang disimpan di sini.</p>';
case'Skill':return '<h2>Skill & latihan</h2><p>Skill point: '+s.skillpts+'</p>'+Object.entries(s.skills).map(([n,v])=>'<div class="item"><span>'+n+' · Lv '+v+'</span><button onclick="learn(\''+n+'\')">Upgrade (1 pt)</button></div>').join('')+'<button onclick="train()">📚 Latihan fisik (2 jam, 15 gold)</button>';
case'Journal':return '<h2>Journal</h2><p>Hari '+s.day+' · '+time()+'</p><p>Monster: '+s.kills+' · Quest: '+s.quests+'</p><p>Perjalanan di Eldoria.</p><p>Quest aktif: '+(s.quest?s.quest.name:'-')+'</p>';
}}
function rank(){return s.kills<5?'F':s.kills<12?'E':s.kills<25?'D':s.kills<50?'C':'B'}
function rest(){s.energy=Math.min(100,s.energy+55);s.hp=Math.min(100,s.hp+35);s.mp=Math.min(maxmp(),s.mp+maxmp());advance(6);log('Istirahat panjang. HP, MP dan energi pulih.')}
function eat(){if(!s.inv.Roti){log('Tidak ada roti.');return}s.inv.Roti--;if(!s.inv.Roti)delete s.inv.Roti;s.hunger=Math.max(0,s.hunger-35);s.mood=Math.min(100,s.mood+8);log('Makan roti. Hunger berkurang.')}
function market(){tab='Inventory';if(s.gold<15){log('Gold tidak cukup untuk membeli.');return}s.gold-=15;s.inv.Roti=(s.inv.Roti||0)+1;s.inv.Potion=(s.inv.Potion||0)+1;log('Beli 1 roti dan 1 potion seharga 15 gold.')}
function talk(){advance(1);let lines=['Warga berkata: guild selalu membutuhkan petualang baru.','Pedagang menyarankan membawa potion saat berburu.','Seorang warga bercerita tentang hutan di utara.','Tavern ramai malam ini.'];log(lines[Math.floor(Math.random()*lines.length)])}
function setjob(j){s.job=j;log('Kamu mulai bekerja sebagai '+j+'.')}
function work(){if(s.job==='Belum bekerja'){log('Pilih pekerjaan dulu.');return}if(s.energy<25){log('Energi tidak cukup untuk shift.');return}s.energy-=25;let w={'Penjaga Kota':48,'Pengrajin':40,'Petani':32,'Pelayan Tavern':28}[s.job]||25;s.gold+=w;advance(4);log('Shift selesai. Kamu menerima '+w+' gold.')}
function train(){if(s.gold<15||s.energy<20){log('Gold atau energi tidak cukup.');return}s.gold-=15;s.energy-=20;s.stats.atk++;advance(2);log('Latihan selesai. ATK meningkat 1.')}
function learn(k){if(!s.skillpts){log('Skill point belum tersedia.');return}s.skillpts--;s.skills[k]++;log(k+' meningkat ke level '+s.skills[k]+'.')}
function hunt(n){if(s.fight){log('Selesaikan pertarungan dulu.');return}if(s.energy<20){log('Energi tidak cukup.');return}s.energy-=20;advance(2);let m=mobs.find(x=>x.n===n);s.fight={m:{...m},hp:m.hp};log('Encounter: '+n+'!')}
function combat(){let m=s.fight.m;return '<hr><h3>⚔ '+m.n+' · HP '+s.fight.hp+'/'+m.hp+'</h3><div class="actions"><button onclick="attack()">Serang</button><button onclick="special()">Skill</button><button onclick="defend()">Bertahan</button><button onclick="escape()">Kabur</button></div>'}
function enemyhit(){let m=s.fight.m,hit=Math.max(1,m.atk-s.stats.def-Math.floor(s.skills.Guard/2));s.hp-=hit;if(s.hp<=0){s.hp=35;s.gold=Math.floor(s.gold*.8);s.fight=null;s.loc='Eldoria';return 'Kamu kalah, dibawa kembali ke kota. Gold berkurang 20%.'}return m.n+' menyerang, damage '+hit+'.'}
function attack(){if(!s.fight)return;let d=s.stats.atk+Math.floor(Math.random()*4)+s.skills.Power*2;s.fight.hp-=d;if(s.fight.hp<=0){win();return}let msg=enemyhit();log('Serangan '+d+' damage. '+msg)}
function special(){if(!s.fight)return;if(s.mp<12){log('MP tidak cukup.');return}s.mp-=12;let d=s.stats.mag*2+10+s.skills.Power*3;s.fight.hp-=d;if(s.fight.hp<=0){win();return}let msg=enemyhit();log('Skill menghasilkan '+d+' damage. '+msg)}
function defend(){if(!s.fight)return;s.hp=Math.min(100,s.hp+Math.ceil(s.stats.def/2));let msg=enemyhit();log('Kamu bertahan dan memulihkan sedikit HP. '+msg)}
function escape(){s.fight=null;log('Kamu berhasil mundur dari encounter.')}
function win(){let m=s.fight.m;s.fight=null;s.gold+=m.g;s.kills++;s.inv[m.drop]=(s.inv[m.drop]||0)+1;addxp(m.xp);if(s.quest&&s.quest.target===m.n){s.quest.done=true}s.log.unshift(m.n+' dikalahkan! '+m.drop+' x1, '+m.g+' gold.');save();render()}
function takequest(){if(s.quest&&!s.quest.done){log('Quest masih aktif.');return}let m=mobs[Math.floor(Math.random()*mobs.length)];s.quest={name:'Buru '+m.n,target:m.n,done:false};log('Quest diterima: kalahkan '+m.n+'.')}
function claim(){if(!s.quest||!s.quest.done){log('Quest belum selesai.');return}s.gold+=35;s.quests++;s.quest=null;log('Reward quest: 35 gold.');}
function useitem(n){if(!s.inv[n])return;if(n==='Roti'){s.inv[n]--;s.hunger=Math.max(0,s.hunger-35);s.mood=Math.min(100,s.mood+5)}else if(n==='Potion'){s.inv[n]--;s.hp=Math.min(100,s.hp+50);s.mp=Math.min(maxmp(),s.mp+25)}if(!s.inv[n])delete s.inv[n];log('Item '+n+' digunakan.')}
function exportSave(){let b=new Blob([JSON.stringify(s)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='eldoria-save.json';a.click();URL.revokeObjectURL(u)}
function importSave(){let i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{let r=new FileReader();r.onload=()=>{try{s=JSON.parse(r.result);save();render()}catch(e){alert('Save invalid')}};r.readAsText(i.files[0])};i.click()}
function reset(){if(confirm('Hapus save dan mulai baru?')){localStorage.removeItem('loa_save');s=null;render()}}
render();
</script></body></html>
