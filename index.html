<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fivefold RPG</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101521;color:#eef2fa;font:15px system-ui;background:radial-gradient(ellipse at top,#26314c,#101521 65%)}.wrap{max-width:760px;margin:auto;padding:14px}.panel{background:#1c2435;border:1px solid #39465e;border-radius:15px;padding:15px;margin:12px 0}.logo{text-align:center;color:#e5c77b;font-size:30px;font-weight:900;letter-spacing:3px}.muted{color:#aebbd0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.cls,.item{padding:12px;background:#263147;border:1px solid #485a77;border-radius:12px}.cls{cursor:pointer}.cls.sel{border:2px solid #e6c46f}.btn{border:0;border-radius:10px;padding:11px;background:#d8b768;color:#151a23;font-weight:800;width:100%;cursor:pointer;margin-top:8px}.btn.alt{background:#394966;color:#fff}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{background:#121927;padding:10px;border-radius:10px}.meter{height:10px;border-radius:10px;background:#3b4050;overflow:hidden;margin:6px 0}.fill{height:100%;background:#4ac078}.enemy{text-align:center;font-size:48px;padding:8px}.log{max-height:180px;overflow:auto;background:#101722;padding:10px;border-radius:9px;font-size:13px}.hide{display:none}input{padding:12px;border-radius:9px;background:#121927;color:white;border:1px solid #46546b;width:100%}small{color:#bdc8d8}.item{margin:6px 0}.inline{display:flex;gap:8px}.inline>*{flex:1}
</style></head><body><div class="wrap"><div class="panel"><div class="logo">FIVEFOLD</div><div class="muted">Fantasy adventure • Autosave</div></div>
<section id="create" class="panel"><h2>Create Adventurer</h2><label>Nama karakter</label><input id="name" value="Koi" maxlength="16"><h3>Pilih class</h3><div class="grid" id="classes"></div><button class="btn" onclick="start()">Mulai Petualangan</button></section>
<section id="game" class="hide"><div class="panel"><h2 id="heroName"></h2><div id="summary" class="muted"></div><div class="stats" id="stats"></div><div id="bars"></div></div>
<div class="panel"><h2>🌲 Field</h2><div class="enemy" id="enemyIcon"></div><h3 id="enemyName" style="text-align:center"></h3><div class="meter"><div class="fill" id="enemyBar"></div></div><p id="enemyHp" class="muted" style="text-align:center"></p><button class="btn" onclick="attack()">Attack</button><button class="btn alt" onclick="skill()">Class Skill</button><button class="btn alt" onclick="explore()">Explore</button></div>
<div class="panel"><h2>🏘️ Town</h2><div class="grid"><button class="btn alt" onclick="inn()">Inn (20g)</button><button class="btn alt" onclick="shop()">Shop</button><button class="btn alt" onclick="smith()">Blacksmith</button><button class="btn alt" onclick="skillTree()">Skill Master</button></div><div id="townInfo"></div></div>
<div class="panel"><h2>🎒 Inventory & Equipment</h2><div id="equipView"></div><div id="inventoryView"></div></div>
<div class="panel"><h2>👥 Party</h2><div id="partyView"></div><button class="btn alt" onclick="recruit()">Recruit (60 gold)</button></div>
<div class="panel"><h2>🗺️ Dungeon</h2><p id="dungeonInfo"></p><button class="btn" onclick="dungeon()">Enter / advance</button></div>
<div class="panel"><h2>🌟 Skill upgrades</h2><div id="skillView"></div></div><div class="panel"><h3>Adventure Log</h3><div class="log" id="log"></div></div></section></div>
<script>
const classes={Warrior:{icon:'🛡️',hp:125,mp:35,atk:15,def:13,skill:'Powerful blow',power:2.1},Archer:{icon:'🏹',hp:90,mp:55,atk:18,def:6,skill:'Focused shot',power:1.8},Thief:{icon:'🗡️',hp:85,mp:60,atk:20,def:5,skill:'Swift strike',power:2},Dancer:{icon:'💃',hp:95,mp:75,atk:12,def:7,skill:'Rhythm',power:1.4},Mage:{icon:'🔮',hp:80,mp:100,atk:22,def:4,skill:'Arcane burst',power:2.3}};
const monsters=[['🐺','Wolf',38,8],['🟢','Slime',30,6],['🦇','Bat',44,10],['🦴','Skeleton',52,12],['🐗','Boar',62,14],['👹','Ogre',90,17]];
const gear=[{name:'Iron sword',slot:'Weapon',atk:4,cost:40},{name:'Oak staff',slot:'Weapon',atk:3,mp:10,cost:45},{name:'Leather armor',slot:'Armor',def:3,cost:40},{name:'Traveler boots',slot:'Boots',def:2,cost:30},{name:'Copper helm',slot:'Helmet',def:2,cost:35},{name:'Potion',slot:'Consumable',heal:40,cost:15},{name:'Mana tonic',slot:'Consumable',mana:30,cost:15}];
let chosen='Warrior',p=null,e=null,level=1,xp=0,gold=80,floor=1,skillPoints=0,upgrades=0,bag=[],equipped={},party=[],dungeonMode=false,enemyIndex=0;
function renderClasses(){classesUI()}
function classesUI(){document.getElementById('classes').innerHTML=Object.entries(classes).map(([k,v])=>'<div class="cls '+(chosen===k?'sel':'')+'" onclick="pick(\''+k+'\')"><b>'+v.icon+' '+k+'</b><p>HP '+v.hp+' • MP '+v.mp+' • ATK '+v.atk+' • DEF '+v.def+'</p></div>').join('')}
function pick(k){chosen=k;classesUI()}
function start(){if(load()) {document.getElementById('create').classList.add('hide');document.getElementById('game').classList.remove('hide');log('Save dipulihkan.');render();return}let c=classes[chosen];p={name:document.getElementById('name').value||'Adventurer',hp:c.hp,maxhp:c.hp,mp:c.mp,maxmp:c.mp,atk:c.atk,def:c.def};document.getElementById('create').classList.add('hide');document.getElementById('game').classList.remove('hide');spawn();log('Petualangan dimulai: '+chosen+'.');render();save()}
function spawn(){let m=monsters[Math.floor(Math.random()*monsters.length)];e={icon:m[0],name:m[1],hp:m[2]+level*3+(dungeonMode?floor*12:0),maxhp:m[2]+level*3+(dungeonMode?floor*12:0),atk:m[3]+level+(dungeonMode?floor*2:0)};render()}
function totalStat(key){return (p[key]||0)+party.reduce((a,x)=>a+(x[key]||0),0)+(Object.values(equipped).reduce((a,x)=>a+(x[key]||0),0))}
function render(){if(!p)return;document.getElementById('heroName').textContent=classes[chosen].icon+' '+p.name+' • Lv '+level+' '+chosen;document.getElementById('summary').textContent='EXP '+xp+'/'+(level*50)+' • Gold '+gold+' • Skill pts '+skillPoints;document.getElementById('stats').innerHTML=['atk','def'].map(k=>'<div class="stat">'+k.toUpperCase()+': '+totalStat(k)+'</div>').join('')+'<div class="stat">❤️ '+p.hp+'/'+p.maxhp+'</div><div class="stat">💧 '+p.mp+'/'+p.maxmp+'</div>';document.getElementById('bars').innerHTML='<div class="meter"><div class="fill" style="width:'+100*p.hp/p.maxhp+'%"></div></div>';document.getElementById('enemyIcon').textContent=e.icon;document.getElementById('enemyName').textContent=e.name+(dungeonMode?' • Dungeon '+floor:'');document.getElementById('enemyHp').textContent=e.hp+'/'+e.maxhp+' HP';document.getElementById('enemyBar').style.width=100*e.hp/e.maxhp+'%';document.getElementById('dungeonInfo').textContent='Floor '+floor+' • '+(dungeonMode?'Dungeon encounter active':'Enter to begin');renderExtras();save()}
function renderExtras(){document.getElementById('equipView').innerHTML='<b>Equipped</b><p>'+['Weapon','Armor','Helmet','Boots'].map(s=>s+': '+(equipped[s]?.name||'—')).join(' • ')+'</p>';document.getElementById('inventoryView').innerHTML='<b>Bag ('+bag.length+')</b>'+bag.map((it,i)=>'<div class="item">'+it.name+' '+statText(it)+' <button onclick="useItem('+i+')">Use/equip</button></div>').join('')||'<small>Empty</small>';document.getElementById('partyView').innerHTML=party.map((x,i)=>'<div class="item">'+x.icon+' '+x.name+' ('+x.cls+') ATK '+x.atk+' DEF '+x.def+' <button onclick="dismiss('+i+')">Dismiss</button></div>').join('')||'Belum ada anggota';document.getElementById('skillView').innerHTML='Skill point: '+skillPoints+' • upgrade level '+upgrades+' <button onclick="skillTree()">Upgrade skill (1 point)</button>'}
function statText(it){return (it.atk?'ATK +'+it.atk+' ':'')+(it.def?'DEF +'+it.def+' ':'')+(it.heal?'HP +'+it.heal:'')+(it.mana?'MP +'+it.mana:'')}
function log(t){let a=document.getElementById('log');a.innerHTML=t+'<br>'+a.innerHTML}
function hit(d){e.hp=Math.max(0,e.hp-d);log('Damage '+d+' ke '+e.name);if(e.hp===0){gold+=12+level*3;xp+=25;log('Menang! +25 EXP, gold bertambah.');if(xp>=level*50){xp-=level*50;level++;skillPoints++;p.maxhp+=12;p.maxmp+=8;p.atk+=3;p.def+=2;p.hp=p.maxhp;p.mp=p.maxmp;log('Level up! Skill point +1.')}if(Math.random()<.65)bag.push({...gear[Math.floor(Math.random()*5)],cost:0});if(dungeonMode){floor++;log('Dungeon floor cleared!')}dungeonMode=false;spawn();return true}return false}
function enemyTurn(){let incoming=Math.max(1,e.atk-totalStat('def'));p.hp=Math.max(1,p.hp-incoming);log(e.name+' menyerang, HP berkurang '+incoming+'.')}
function attack(){if(!hit(totalStat('atk'))){enemyTurn()}render()}
function skill(){let c=classes[chosen],cost=20;if(p.mp<cost){log('MP tidak cukup.');return}p.mp-=cost;if(chosen==='Dancer'){party.forEach(x=>x.atk+=1);log('Party mendapat boost kecil!')}if(!hit(Math.floor(totalStat('atk')*c.power+upgrades*2)))enemyTurn();render()}
function explore(){dungeonMode=false;spawn();log('Menjelajah: '+e.name);render()}
function dungeon(){dungeonMode=true;spawn();log('Memasuki dungeon floor '+floor+'.');render()}
function inn(){if(gold<20){log('Gold tidak cukup.');return}gold-=20;p.hp=p.maxhp;p.mp=p.maxmp;log('Istirahat di inn.');render()}
function shop(){document.getElementById('townInfo').innerHTML='<h3>Shop</h3>'+gear.map((x,i)=>'<div class="item">'+x.name+' '+statText(x)+' — '+x.cost+'g <button onclick="buy('+i+')">Buy</button></div>').join('')}
function buy(i){let it=gear[i];if(gold<it.cost){log('Gold kurang.');return}gold-=it.cost;bag.push({...it});log('Membeli '+it.name);render()}
function smith(){let slot=Object.keys(equipped);if(!slot.length){log('Equip item dulu sebelum upgrade.');return}if(gold<50){log('Upgrade perlu 50 gold.');return}let item=equipped[slot[0]];gold-=50;item.atk=(item.atk||0)+1;item.def=(item.def||0)+1;item.name+=' +';log('Equipment ditingkatkan.');render()}
function skillTree(){if(skillPoints<=0){log('Belum punya skill point.');return}skillPoints--;upgrades++;p.atk+=2;p.def+=1;p.maxhp+=5;p.hp=Math.min(p.maxhp,p.hp+5);log('Upgrade skill: stats meningkat.');render()}
function recruit(){if(party.length>=3){log('Party penuh (4 total).');return}if(gold<60){log('Gold kurang.');return}gold-=60;let cls=Object.keys(classes).filter(x=>x!==chosen)[Math.floor(Math.random()*4)],c=classes[cls];party.push({name:['Airi','Ren','Mika','Yuna','Sora','Haru'][Math.floor(Math.random()*6)],cls,icon:c.icon,atk:Math.floor(c.atk*.5),def:Math.floor(c.def*.5),hp:c.hp});log('Anggota '+cls+' direkrut.');render()}
function dismiss(i){party.splice(i,1);render()}
function useItem(i){let it=bag[i];if(it.heal){p.hp=Math.min(p.maxhp,p.hp+it.heal);bag.splice(i,1)}else if(it.mana){p.mp=Math.min(p.maxmp,p.mp+it.mana);bag.splice(i,1)}else if(it.slot){equipped[it.slot]=it;bag.splice(i,1)}else{log('Item ini tidak dapat digunakan.')}render()}
function save(){try{localStorage.setItem('fivefoldSave',JSON.stringify({chosen,p,level,xp,gold,floor,skillPoints,upgrades,bag,equipped,party}))}catch{}}
function load(){try{let s=JSON.parse(localStorage.getItem('fivefoldSave')||'null');if(!s)return false;chosen=s.chosen;p=s.p;level=s.level;xp=s.xp;gold=s.gold;floor=s.floor||1;skillPoints=s.skillPoints||0;upgrades=s.upgrades||0;bag=s.bag||[];equipped=s.equipped||{};party=s.party||[];spawn();return true}catch{return false}}
renderClasses();
</script></body></html>
