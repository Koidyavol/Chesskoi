<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Fivefold RPG</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101521;color:#f0f2f7;font:15px system-ui;background:radial-gradient(ellipse at top,#26314c,#101521 65%)}.wrap{max-width:760px;margin:auto;padding:16px}.panel{background:#1c2435;border:1px solid #39465e;border-radius:15px;padding:16px;margin:12px 0}.logo{text-align:center;color:#e5c77b;font-size:30px;font-weight:900;letter-spacing:3px}.muted{color:#aebbd0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.cls{padding:13px;background:#263147;border:1px solid #485a77;border-radius:12px;cursor:pointer}.cls.sel{border:2px solid #e6c46f}.cls h3{margin:0 0 5px}.cls p{margin:5px 0;font-size:13px;color:#bac6d8}.btn{border:0;border-radius:10px;padding:12px;background:#d8b768;color:#151a23;font-weight:800;width:100%;cursor:pointer;margin-top:8px}.btn.alt{background:#394966;color:#fff}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{background:#121927;padding:10px;border-radius:10px}.meter{height:10px;border-radius:10px;background:#3b4050;overflow:hidden;margin-top:5px}.fill{height:100%;background:#4ac078}.enemy{font-size:48px;text-align:center;padding:8px}.log{max-height:180px;overflow:auto;background:#101722;padding:10px;border-radius:9px;font-size:13px}.hide{display:none}input{padding:12px;border-radius:9px;background:#121927;color:white;border:1px solid #46546b;width:100%}
</style></head><body><div class="wrap"><div class="panel hero"><div class="logo">FIVEFOLD</div><div class="muted">A small fantasy adventure</div></div>
<section id="create" class="panel"><h2>Create Adventurer</h2><label>Nama karakter</label><input id="name" value="Koi" maxlength="16"><h3>Pilih class</h3><div class="grid" id="classes"></div><button class="btn" onclick="start()">Mulai Petualangan</button></section>
<section id="game" class="hide"><div class="panel"><h2 id="heroName"></h2><div id="summary" class="muted"></div><div class="stats" id="stats"></div><div id="bars"></div></div><div class="panel"><h2>🌲 Greenleaf Outskirts</h2><div class="enemy" id="enemyIcon">🐺</div><h3 id="enemyName" style="text-align:center">Wild Wolf</h3><div class="meter"><div class="fill" id="enemyBar" style="width:100%"></div></div><p id="enemyHp" class="muted" style="text-align:center"></p><button class="btn" onclick="attack()">⚔️ Attack</button><button class="btn alt" onclick="skill()">✨ Class Skill</button><button class="btn alt" onclick="rest()">🧪 Rest (restore HP/MP)</button><button class="btn alt" onclick="nextEnemy()">Explore / Next Monster</button></div><div class="panel" id="townPanel"><h2>🏘️ Greenleaf Town</h2><p class="muted">Kunjungi layanan kota.</p><div class="grid"><button class="btn alt" onclick="openTown('inn')">Inn</button><button class="btn alt" onclick="openTown('shop')">Shop</button><button class="btn alt" onclick="openTown('smith')">Blacksmith</button><button class="btn alt" onclick="openTown('master')">Skill Master</button></div><div id="townInfo"></div></div>
<div class="panel"><h2>🎒 Inventory & Equipment</h2><div id="equipView"></div><div id="inventoryView"></div></div>
<div class="panel"><h2>👥 Party</h2><div id="partyView"></div><button class="btn alt" onclick="recruit()">Recruit random adventurer (cost 60 gold)</button></div>
<div class="panel"><h2>🗺️ Dungeon</h2><p id="dungeonInfo">Dungeon: floor 1 • monsters tougher, rewards better.</p><button class="btn" onclick="dungeon()">Enter dungeon</button></div>
<div class="panel"><h2>🌟 Skill Tree</h2><div id="skillView"></div><button class="btn alt" onclick="skillPoint()">Spend skill point</button></div><div class="panel"><h3>Adventure Log</h3><div id="log" class="log"></div></div></section></div>
<script>
const classes={
Warrior:{icon:'🛡️',desc:'Tank • sword & shield',hp:125,mp:35,atk:15,def:13,skill:'Heavy Strike',power:2.1},
Archer:{icon:'🏹',desc:'Ranged • critical',hp:90,mp:55,atk:18,def:6,skill:'Double Shot',power:1.8},
Thief:{icon:'🗡️',desc:'Fast • evasive',hp:85,mp:60,atk:20,def:5,skill:'Quick Slash',power:2},
Dancer:{icon:'💃',desc:'Support • buffs',hp:95,mp:75,atk:12,def:7,skill:'Battle Rhythm',power:1.4},
Mage:{icon:'🔮',desc:'Magic • AoE',hp:80,mp:100,atk:22,def:4,skill:'Arcane Burst',power:2.3}};
let chosen='Warrior',player=null,enemy=null,level=1,xp=0,gold=0;
const monsters=[['🐺','Wild Wolf',38,8],['🟢','Slime',30,6],['🦇','Cave Bat',44,10],['🦴','Skeleton',52,12],['🐗','Forest Boar',62,14]];
function renderClasses(){document.getElementById('classes').innerHTML=Object.entries(classes).map(([k,v])=>'<div class="cls '+(chosen===k?'sel':'')+'" onclick="pick(\''+k+'\')"><h3>'+v.icon+' '+k+'</h3><p>'+v.desc+'</p><small>HP '+v.hp+' • ATK '+v.atk+' • DEF '+v.def+'</small></div>').join('')}
function pick(k){chosen=k;renderClasses()}
function start(){let c=classes[chosen];player={name:document.getElementById('name').value||'Adventurer',hp:c.hp,maxhp:c.hp,mp:c.mp,maxmp:c.mp,atk:c.atk,def:c.def};document.getElementById('create').classList.add('hide');document.getElementById('game').classList.remove('hide');spawn();log('Petualangan dimulai. Class '+chosen+' terpilih.');render()}
function spawn(){let m=monsters[Math.floor(Math.random()*monsters.length)];enemy={icon:m[0],name:m[1],hp:m[2]+level*3,maxhp:m[2]+level*3,atk:m[3]+level};render()}
function render(){if(!player)return;document.getElementById('heroName').textContent=classes[chosen].icon+' '+player.name+' • Lv '+level+' '+chosen;document.getElementById('summary').textContent='EXP '+xp+' / '+(level*50)+' • Gold '+gold;document.getElementById('stats').innerHTML='<div class="stat">⚔️ ATK: '+player.atk+'</div><div class="stat">🛡️ DEF: '+player.def+'</div><div class="stat">❤️ HP: '+player.hp+'/'+player.maxhp+'</div><div class="stat">💧 MP: '+player.mp+'/'+player.maxmp+'</div>';document.getElementById('bars').innerHTML='<div class="meter"><div class="fill" style="width:'+100*player.hp/player.maxhp+'%"></div></div>';document.getElementById('enemyIcon').textContent=enemy.icon;document.getElementById('enemyName').textContent=enemy.name;document.getElementById('enemyHp').textContent=enemy.hp+'/'+enemy.maxhp+' HP';document.getElementById('enemyBar').style.width=100*enemy.hp/enemy.maxhp+'%'}
function log(t){let el=document.getElementById('log');el.innerHTML=t+'<br>'+el.innerHTML}
function hitEnemy(d){enemy.hp=Math.max(0,enemy.hp-d);log('Kamu menyerang '+enemy.name+' ('+d+' damage).');if(enemy.hp<=0){gold+=8+level*2;xp+=20;log(enemy.name+' defeated! +20 EXP, gold earned.');if(xp>=level*50){xp-=level*50;level++;player.maxhp+=10;player.maxmp+=8;player.atk+=3;player.def+=1;player.hp=player.maxhp;player.mp=player.maxmp;log('LEVEL UP! Sekarang level '+level+'.')}spawn();return true}return false}
function enemyTurn(){if(!enemy||enemy.hp<=0)return;let d=Math.max(1,enemy.atk-player.def);player.hp=Math.max(0,player.hp-d);log(enemy.name+' menyerang balik ('+d+' damage).');if(player.hp<=0){player.hp=1;player.mp=0;log('Kamu kelelahan dan kembali ke kota dengan 1 HP.')}render()}
function attack(){if(hitEnemy(player.atk)){render();return}enemyTurn();render()}
function skill(){let c=classes[chosen];let cost=chosen==='Dancer'?18:20;if(player.mp<cost){log('MP tidak cukup!');return}player.mp-=cost;if(chosen==='Dancer'){player.atk+=4;log('Battle Rhythm! ATK meningkat sementara (4).');hitEnemy(Math.floor(player.atk*c.power));}else{hitEnemy(Math.floor(player.atk*c.power));}if(enemy.hp>0)enemyTurn();render()}
function rest(){player.hp=Math.min(player.maxhp,player.hp+Math.ceil(player.maxhp*.35));player.mp=Math.min(player.maxmp,player.mp+Math.ceil(player.maxmp*.4));log('Beristirahat: HP dan MP dipulihkan.');render()}
function nextEnemy(){spawn();log('Kamu menjelajah dan menemukan '+enemy.name+'.')}
renderClasses();
</script></body></html>
