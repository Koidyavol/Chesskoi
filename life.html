<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Koi Life</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f4f7;color:#263341;font:15px system-ui}.wrap{max-width:760px;margin:auto;padding:14px}.panel{background:white;border:1px solid #dce3ea;border-radius:15px;padding:15px;margin:12px 0;box-shadow:0 3px 12px #18283a08}.hero{background:linear-gradient(135deg,#567cba,#78a6cf);color:white;border-radius:16px;padding:18px}.hero h1{margin:4px 0}.muted{color:#748293}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{background:#f5f7fa;padding:10px;border-radius:10px}.meter{height:7px;background:#dce4eb;border-radius:9px;overflow:hidden;margin-top:6px}.fill{height:100%;background:#6ba8a0}.btn{border:0;border-radius:10px;padding:12px;background:#567cba;color:white;font-weight:750;cursor:pointer;width:100%;margin:3px 0}.btn.alt{background:#edf1f6;color:#35485d}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.event{padding:12px;background:#f7f9fb;border-left:4px solid #78a6cf;border-radius:9px;margin:8px 0}.choice{background:#fff;border:1px solid #d5e0eb;border-radius:10px;padding:11px;color:#263341;width:100%;text-align:left;margin:5px 0;cursor:pointer}.log{max-height:330px;overflow:auto}.hide{display:none}input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #cbd5df;margin:8px 0;background:#fff;color:#263341}.pill{display:inline-block;background:#eaf1f8;color:#41658e;padding:5px 9px;border-radius:20px;font-size:12px}.tabs{display:flex;gap:6px}.tabs button{flex:1}.foot{font-size:12px;color:#8492a0}.npcCard{cursor:pointer;transition:transform .15s}.npcCard:active{transform:scale(.97)}.modal{position:fixed;inset:0;background:#172536aa;display:flex;align-items:center;justify-content:center;padding:16px;z-index:99}.modalBox{background:#fff;border-radius:16px;max-width:440px;width:100%;max-height:90vh;overflow:auto;padding:18px}.modal.hide{display:none}
</style></head><body><div class="wrap">
<header class="hero"><div style="font-weight:900;letter-spacing:1px">KOI LIFE</div><h1 id="headline">Simulasi Kehidupan</h1><div id="summary">Mulai perjalanan hidupmu sendiri.</div></header>
<section id="setup" class="panel"><h2>Buat karakter</h2><input id="name" placeholder="Nama karakter" maxlength="24"><label>Jenis kelamin</label><select id="gender"><option>Pria</option><option>Wanita</option></select><label>Tempat lahir</label><input id="city" placeholder="Kota"><button class="btn" onclick="start()">Mulai kehidupan</button></section>
<section id="game" class="hide">
<div class="panel"><div style="display:flex;justify-content:space-between;align-items:center"><h2 id="hero" style="margin:0"></h2><span class="pill" id="age">0 tahun</span></div><div class="muted" id="meta"></div><div class="stats" id="stats"></div></div>
<div class="panel"><h3>👨‍👩‍👧 Keluarga</h3><div id="family"></div></div><div class="panel"><h3>👥 Warga sekitar</h3><div id="npcGallery" class="grid"></div><div class="muted">Ketuk warga untuk melihat profil dan stat.</div></div><div class="panel"><h3>📚 Kisah hidup</h3><div id="eventbox"></div></div>
<div class="panel"><h3>🎯 Aktivitas</h3><div class="grid"><button class="btn alt" onclick="activity('study')">📖 Belajar</button><button class="btn alt" onclick="activity('hobby')">🎨 Hobi</button><button class="btn alt" onclick="activity('exercise')">🏃 Aktivitas fisik</button><button class="btn alt" onclick="activity('social')">🫂 Bersosialisasi</button><button class="btn alt" onclick="activity('work')">💼 Bekerja</button><button class="btn alt" onclick="activity('rest')">🛌 Istirahat</button></div></div>
<div class="panel"><h3>💼 Pendidikan & pekerjaan</h3><div id="career"></div><div id="careerActions"></div><div id="jobList"></div></div>
<div class="panel"><h3>💰 Keuangan</h3><div id="money"></div><button class="btn alt" onclick="activity('save')">Simpan uang (aktivitas ringan)</button></div>
<div class="panel"><h3>📜 Riwayat</h3><div id="log" class="log"></div></div>
<button class="btn" onclick="ageUp()">⏳ Jalani tahun berikutnya</button><button class="btn alt" onclick="resetGame()">Mulai hidup baru</button></section></div>
<script>
const key='koiLifeBitStyle';
let s=null;
try{s=JSON.parse(localStorage.getItem(key)||'null')}catch(e){s=null;try{localStorage.removeItem(key)}catch(_){}}
if(s && (!s.family || !Array.isArray(s.history) || typeof s.age!=='number')){s=null;try{localStorage.removeItem(key)}catch(_){}}
const events={
child:['Hari sekolah: seorang teman mengajak bermain.','Kamu menemukan buku menarik di perpustakaan.','Keluarga menghabiskan akhir pekan bersama.','Ada kegiatan kelas yang seru.'],
teen:['Ada klub sekolah yang membuka pendaftaran.','Tugas sekolah menumpuk, kamu perlu mengatur waktu.','Teman mengajak ikut kegiatan setelah sekolah.','Kamu mulai menemukan minat baru.'],
adult:['Ada kesempatan pekerjaan baru.','Teman lama mengajak berkumpul.','Kamu mempertimbangkan tujuan hidup berikutnya.','Pengeluaran bulanan terasa meningkat.'],
senior:['Kamu mengenang perjalanan hidup selama ini.','Ada kesempatan berbagi pengalaman dengan orang lain.','Kamu menikmati waktu luang yang lebih banyak.']};
const npcList=[{name:'佐藤美咲',role:'Warga',img:'IMG-20261127-WA0133.jpg'},{name:'高橋悠斗',role:'Warga',img:'IMG-20261127-WA1940.jpg'},{name:'小林葵',role:'Warga',img:'IMG-20261127-WA2506.jpg'},{name:'田中蓮',role:'Warga',img:'IMG-20261127-WA4275.jpg'},{name:'伊藤さくら',role:'Warga',img:'IMG-20261127-WA4943.jpg'},{name:'渡辺大翔',role:'Warga',img:'IMG-20261127-WA5875.jpg'},{name:'山本結衣',role:'Warga',img:'IMG-20261127-WA7158.jpg'},{name:'中村颯太',role:'Warga',img:'IMG-20261127-WA7291.jpg'},{name:'加藤莉子',role:'Warga',img:'IMG-20261127-WA9382.jpg'},{name:'吉田陽向',role:'Warga',img:'IMG-20261127-WA9882.jpg'}];
function npcStats(){return {age:Math.floor(Math.random()*40)+18,health:Math.floor(Math.random()*31)+70,happiness:Math.floor(Math.random()*31)+60,intelligence:Math.floor(Math.random()*41)+40,energy:Math.floor(Math.random()*31)+70,personality:['Ramah','Pendiam','Ceria','Rajin','Santai','Pemberani'][Math.floor(Math.random()*6)],job:['Pelajar','Kasir','Guru','Barista','Freelancer','Pegawai kantor'][Math.floor(Math.random()*6)]}}\nnpcList.forEach(n=>Object.assign(n,npcStats()));\nfunction showNPC(i){const n=npcList[i];if(!n)return;document.getElementById('npcDetails').innerHTML='<div style=\"text-align:center\"><img src=\"'+n.img+'\" style=\"width:150px;height:190px;object-fit:cover;border-radius:12px\" onerror=\"this.style.display=\\\'none\\\'\"><h2>'+n.name+'</h2><span class=\"pill\">'+n.job+'</span></div><h3>Profil warga</h3><div class=\"stats\">'+[['Usia',n.age+' tahun'],['Kepribadian',n.personality],['Kesehatan',n.health+'/100'],['Kebahagiaan',n.happiness+'/100'],['Kecerdasan',n.intelligence+'/100'],['Energi',n.energy+'/100']].map(([a,b])=>'<div class=\"stat\"><b>'+a+'</b><br>'+b+'</div>').join('')+'</div>';document.getElementById('npcModal').classList.remove('hide')}\nfunction closeNPC(e){if(e&&e.target!==document.getElementById('npcModal'))return;document.getElementById('npcModal').classList.add('hide')}\nfunction save(){try{localStorage.setItem(key,JSON.stringify(s))}catch(e){alert('Gagal menyimpan data: '+e.message)}render()}
function parentName(){const names=['Budi','Andi','Dimas','Rudi','Sari','Maya','Dewi','Nina','Putri','Lina'];return names[Math.floor(Math.random()*names.length)]}
function start(){s={name:document.getElementById('name').value.trim()||'Koi',gender:document.getElementById('gender').value,city:document.getElementById('city').value.trim()||'Kota',age:0,money:0,allowance:30,family:{father:parentName(),mother:parentName(),familyMoney:5000,monthlySupport:30},health:80,happiness:70,intelligence:40,energy:80,education:'Belum sekolah',schoolEnrolled:false,schoolGrade:0,job:'Belum bekerja',salary:0,history:[],dead:false};add('Kelahiran','Kamu lahir di '+s.city+'. Kisah hidupmu dimulai.');save()}
function add(title,msg){s.history.unshift({age:s.age,title,msg})}
function clamp(){['health','happiness','intelligence','energy'].forEach(k=>s[k]=Math.max(0,Math.min(100,s[k])))}
function stage(){if(s.age<6)return 'child';if(s.age<18)return 'teen';if(s.age<60)return 'adult';return 'senior'}
function eventText(){let arr=events[stage()];return arr[Math.floor(Math.random()*arr.length)]}
function render(){if(!s)return;document.getElementById('setup').classList.add('hide');document.getElementById('game').classList.remove('hide');document.getElementById('hero').textContent=s.name;document.getElementById('age').textContent=s.age+' tahun';document.getElementById('meta').textContent=s.gender+' • '+s.city+' • '+s.education;document.getElementById('summary').textContent=s.dead?'Kisah hidup telah selesai.':'Menjalani kehidupan dari tahun ke tahun.';let entries=[['Kesehatan',s.health],['Kebahagiaan',s.happiness],['Energi',s.energy],['Kecerdasan',s.intelligence]];document.getElementById('stats').innerHTML=entries.map(([n,v])=>'<div class="stat">'+n+' <b style="float:right">'+v+'/100</b><div class="meter"><div class="fill" style="width:'+v+'%"></div></div></div>').join('');document.getElementById('money').textContent='Saldo: '+s.money+' koin • Pendapatan: '+s.salary+' koin/tahun';document.getElementById('family').innerHTML='<b>Ayah:</b> '+s.family.father+'<br><b>Ibu:</b> '+s.family.mother+'<br><b>Keuangan keluarga:</b> '+s.family.familyMoney+' koin<br><b>Uang saku:</b> '+s.family.monthlySupport+' koin/tahun';document.getElementById('career').innerHTML='<p><b>Pendidikan:</b> '+s.education+'</p><p><b>Pekerjaan:</b> '+s.job+'</p>';document.getElementById('careerActions').innerHTML=careerButtons();document.getElementById('npcGallery').innerHTML=npcList.map(n=>'<div class="stat" style="text-align:center"><img src="'+n.img+'" style="width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px" onerror="this.style.display=\'none\'"><b>'+n.name+'</b><div class="muted">'+n.role+'</div></div>').join('');document.getElementById('eventbox').innerHTML='<div class="event"><b>Usia '+s.age+'</b><br>'+ (s.history[0]?.msg||'')+'</div>';document.getElementById('log').innerHTML=s.history.slice(0,60).map(e=>'<div class="event"><b>Usia '+e.age+' — '+e.title+'</b><br>'+e.msg+'</div>').join('');document.querySelectorAll('#game button').forEach(b=>b.disabled=s.dead)}
function careerButtons(){if(s.age<6)return 'Usia '+s.age+' tahun — masa kanak-kanak.';if(s.age<18)return '<button class="btn" onclick="school()">'+(s.schoolEnrolled?'📚 Belajar di sekolah':'🏫 Daftar sekolah')+'</button>';let b='<button class="btn" onclick="showJobs()">📋 Pilih pekerjaan</button>';if(s.job!=='Belum bekerja')b+='<button class="btn alt" onclick="workShift()">Ambil shift kerja</button>';if(s.age>=18&&s.age<30)b+='<button class="btn alt" onclick="college()">Daftar kuliah (50 koin)</button>';return b}
function activity(a){if(s.dead)return;let m='';if(a==='study'){s.intelligence+=8;s.energy-=12;m='Belajar dengan tekun; kecerdasan meningkat.'}if(a==='hobby'){s.happiness+=10;s.energy-=5;m='Menghabiskan waktu dengan hobi.'}if(a==='exercise'){s.health+=7;s.energy-=15;m='Melakukan aktivitas fisik ringan.'}if(a==='social'){s.happiness+=9;s.money-=5;m='Menghabiskan waktu bersosialisasi (5 koin).'}if(a==='work'){if(s.job==='Belum bekerja')m='Kamu belum memiliki pekerjaan.';else{let earn=Math.max(5,Math.floor(s.salary/4));s.money+=earn;s.energy-=15;m='Melakukan pekerjaan sampingan dan mendapat '+earn+' koin.'}}if(a==='rest'){s.energy+=18;s.happiness+=3;m='Beristirahat dan mengisi energi.'}if(a==='save'){s.happiness+=1;m='Membuat rencana keuangan.'}if(a==='work'&&s.age<18){m='Kamu masih terlalu muda untuk bekerja formal.'}clamp();add('Aktivitas',m);save()}
function school(){if(s.age<6){add('Sekolah','Belum cukup usia untuk mulai sekolah.');save();return}if(s.age>=18){add('Pendidikan','Masa sekolah selesai.');save();return}if(!s.schoolEnrolled){s.schoolEnrolled=true;s.schoolGrade=1;s.education=s.age<=12?'Sekolah dasar kelas 1':s.age<=15?'SMP kelas 1':'SMA kelas 1';add('Pendaftaran sekolah','Kamu mendaftar dan mulai '+s.education+'.');}else{s.intelligence+=5;s.happiness+=3;s.energy-=10;add('Sekolah','Mengikuti pelajaran, mengerjakan tugas, dan mendapat pengalaman sekolah. Kecerdasan meningkat.');}clamp();save()}
function college(){if(s.money<50){add('Kuliah','Uang belum cukup untuk biaya pendaftaran.');save();return}s.money-=50;s.education='Mahasiswa';s.intelligence+=8;add('Kuliah','Kamu mendaftar kuliah.');clamp();save()}
function job(){if(s.age<18){add('Pekerjaan','Belum cukup umur untuk mencari pekerjaan formal.');save();return}let jobs=[['Pekerja toko',80],['Barista',95],['Admin',120],['Teknisi junior',150]];let j=jobs[Math.floor(Math.random()*jobs.length)];s.job=j[0];s.salary=j[1];add('Karier','Kamu diterima sebagai '+j[0]+' dengan gaji tahunan '+j[1]+' koin.');save()}
const jobCatalog=[{"name":"Kasir","req":"Entry","salary":85},{"name":"Barista","req":"Entry","salary":100},{"name":"Pelayan restoran","req":"Entry","salary":95},{"name":"Kurir","req":"Entry","salary":110},{"name":"Asisten kantor","req":"Entry","salary":130},{"name":"Guru","req":"Pendidikan","salary":180,"stat":55},{"name":"Desainer grafis","req":"Pendidikan","salary":210,"stat":55},{"name":"Programmer junior","req":"Pendidikan","salary":250,"stat":60},{"name":"Akuntan","req":"Pendidikan","salary":220,"stat":55},{"name":"Dokter","req":"Kuliah","salary":360,"stat":75},{"name":"Pengacara","req":"Kuliah","salary":340,"stat":75},{"name":"Manajer","req":"Skill","salary":300,"stat":65}];
function showJobs(){let el=document.getElementById('jobList');el.innerHTML='<h4>Daftar lowongan</h4>'+jobCatalog.map((j,i)=>{let ok=s.age>=18&&(j.req==='Entry'||(j.req==='Pendidikan'&&s.intelligence>=j.stat)||(j.req==='Kuliah'&&s.education==='Mahasiswa')||(j.req==='Skill'&&s.intelligence>=j.stat));let req=j.req==='Entry'?'Usia 18+':j.req==='Pendidikan'?'Kecerdasan '+j.stat+'+':j.req==='Kuliah'?'Status mahasiswa':'Kecerdasan '+j.stat+'+';return '<div class="event"><b>'+j.name+'</b><br>Gaji: '+j.salary+' koin/tahun<br><small>Syarat: '+req+'</small><button class="btn" '+(ok?'':'disabled')+' onclick="applyJob('+i+')">'+(ok?'Lamar':'Belum memenuhi syarat')+'</button></div>'}).join('')}
function applyJob(i){let j=jobCatalog[i];if(!j)return;s.job=j.name;s.salary=j.salary;add('Karier','Diterima bekerja sebagai '+j.name+' dengan gaji '+j.salary+' koin/tahun.');document.getElementById('jobList').innerHTML='';save()}
function workShift(){if(s.job==='Belum bekerja')return;let earn=Math.max(10,Math.floor(s.salary/3));s.money+=earn;s.energy-=20;add('Kerja','Kamu bekerja dan memperoleh '+earn+' koin.');clamp();save()}
function ageUp(){if(s.dead)return;s.age++;s.energy=80;if(s.age<18){let sup=s.family.monthlySupport*12;s.money+=sup;s.family.familyMoney-=Math.min(s.family.familyMoney,sup);add('Dukungan keluarga','Orang tua memberimu biaya hidup sebesar '+sup+' koin.');}else{s.money+=s.salary;}if(s.age===6){s.education='Belum sekolah';s.schoolEnrolled=false;add('Usia sekolah','Kini kamu bisa mendaftar SD.');}
if(s.age===13){s.education='SMP';s.schoolEnrolled=false;s.schoolGrade=0;add('Kelulusan','Kamu menyelesaikan SD. Sekarang tersedia pendaftaran SMP.');}
if(s.age===16){s.education='SMA/SMK';s.schoolEnrolled=false;s.schoolGrade=0;add('Kelulusan','Kamu menyelesaikan SMP. Sekarang tersedia pendaftaran SMA/SMK.');}
if(s.age===18){s.education='Lulus SMA/SMK';s.schoolEnrolled=false;add('Kelulusan','Kamu menyelesaikan SMA/SMK dan bisa memilih kuliah atau bekerja.');}if(s.age===60)s.job='Pensiun';let e=eventText();let title='Peristiwa tahunan';if(Math.random()<.25){s.happiness+=8;title='Kabar baik'}else if(Math.random()<.18){s.money=Math.max(0,s.money-15);title='Pengeluaran tak terduga';e+=' Kamu mengeluarkan 15 koin.'}add(title,e);clamp();save()}
function resetGame(){if(confirm('Hapus kehidupan yang tersimpan dan mulai baru?')){localStorage.removeItem(key);s=null;location.reload()}}
if(s){try{render()}catch(e){s=null;try{localStorage.removeItem(key)}catch(_){};document.getElementById('setup').classList.remove('hide');document.getElementById('game').classList.add('hide');alert('Data lama tidak cocok dan telah direset. Silakan mulai lagi.')}}
</script></body></html>
